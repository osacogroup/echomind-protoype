<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body { font-family: 'Open Sans', sans-serif; background: #f5f5f7; color: #1c1c1c; }

  /* OSACO brand tokens */
  :root {
    /* Primary */
    --kimb:    #686CA4;   /* Kimberlite */
    --kimb-d:  #4a4e7a;   /* darkened */
    --kimb-l:  #8589be;   /* lightened */
    --kimb-p:  #eeeef6;   /* pale tint */
    --kimb-t:  #e4e4f0;   /* soft tint */

    /* Secondary */
    --corfu:   #008CB0;   /* Corfu teal */
    --corfu-l: #e0f4fa;
    --plum:    #956188;   /* Plum */
    --plum-l:  #f3eaf1;
    --energized: #D1CD5B; /* Energized yellow */
    --daring:  #FEC340;   /* Daring amber */
    --felt:    #70C097;   /* Felt Green */

    /* EchoMind accent (from logo) */
    --echo-mg: #d520d5;   /* EchoMind magenta */
    --echo-cy: #30c8e8;   /* EchoMind cyan */

    /* Neutrals */
    --ink:     #1c1c1c;
    --ink-mid: #3a3a4a;
    --ink-mute:#6b6b80;
    --ink-lt:  #9999b0;
    --surface: #f5f5f7;
    --white:   #ffffff;
    --border:  #d8d8e8;
    --border-l:#eaeaf2;

    /* Status */
    --success: #1a9070;
    --warn:    #b07820;
    --danger:  #b83030;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--border-l); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  h1, h2, h3, h4, h5 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── colour constants (mirror CSS vars for JS use) ─────── */
const C = {
  kimb:'#686CA4', kimbD:'#4a4e7a', kimbL:'#8589be', kimbP:'#eeeef6', kimbT:'#e4e4f0',
  corfu:'#008CB0', corfuL:'#e0f4fa',
  plum:'#956188', plumL:'#f3eaf1',
  energized:'#D1CD5B', daring:'#FEC340', felt:'#70C097',
  echoMg:'#d520d5', echoCy:'#30c8e8',
  ink:'#1c1c1c', inkMid:'#3a3a4a', inkMute:'#6b6b80', inkLt:'#9999b0',
  surface:'#f5f5f7', white:'#ffffff', border:'#d8d8e8', borderL:'#eaeaf2',
  success:'#1a9070', warn:'#b07820', danger:'#b83030',
};

/* ── Logo: use actual image asset ──────────────────────── */
function EchoMindLogo({ height = 32 }) {
  return <img src="echomind-logo.png" alt="EchoMind" style={{ height, width:'auto', display:'block' }} />;
}
function OsacoLogo({ height = 28 }) {
  return <img src="osaco-logo.png" alt="OSACO" style={{ height, width:'auto', display:'block', filter:'brightness(0) invert(1)' }} />;
}

/* ── Pill label ────────────────────────────────────────── */
function PillLabel({ children, color = C.kimb }) {
  return (
    <span style={{
      display:'inline-block', padding:'3px 14px',
      background: color + '18', color: color,
      borderRadius: 2, fontSize: '0.68rem', fontWeight: 700,
      letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10,
      border: `1px solid ${color}40`,
    }}>{children}</span>
  );
}

/* ── Section heading ───────────────────────────────────── */
function SectionHeading({ label, title, subtitle }) {
  return (
    <div style={{ marginBottom: 28 }}>
      <PillLabel>{label}</PillLabel>
      <h1 style={{ fontFamily:'Bebas Neue', fontSize:'2.6rem', color: C.kimbD, lineHeight:1.1, letterSpacing:'0.05em' }}>{title}</h1>
      {subtitle && <p style={{ color: C.inkMute, marginTop: 7, fontSize:'0.88rem', lineHeight: 1.6 }}>{subtitle}</p>}
    </div>
  );
}

/* ── Card ──────────────────────────────────────────────── */
function Card({ children, style = {}, topBorderColor, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: C.white, border:`1.5px solid ${C.border}`, borderRadius: 4,
      overflow:'hidden', cursor: onClick ? 'pointer' : 'default',
      ...(topBorderColor ? { borderTop:`3px solid ${topBorderColor}` } : {}),
      ...style,
    }}>{children}</div>
  );
}

/* ── Primary button ────────────────────────────────────── */
function PrimaryBtn({ children, onClick, disabled, color = C.kimb, style = {} }) {
  const [hov, setHov] = useState(false);
  const bg = disabled ? '#bbb' : hov ? C.kimbD : color;
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        background: bg, color:'#fff', border:'none', borderRadius: 3,
        padding:'10px 24px', fontFamily:'Open Sans', fontWeight:700,
        fontSize:'0.83rem', cursor: disabled ? 'not-allowed' : 'pointer',
        letterSpacing:'0.06em', textTransform:'uppercase',
        transition:'background 0.18s', ...style,
      }}>{children}</button>
  );
}

/* ── Ghost button ──────────────────────────────────────── */
function GhostBtn({ children, onClick, color = C.kimb, style = {} }) {
  const [hov, setHov] = useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        background: hov ? color + '10' : 'transparent',
        color: hov ? color : C.inkMid,
        border:`1.5px solid ${hov ? color : C.border}`,
        borderRadius: 3, padding:'9px 20px',
        fontFamily:'Open Sans', fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase',
        fontSize:'0.78rem', cursor:'pointer', transition:'all 0.18s', ...style,
      }}>{children}</button>
  );
}

/* ── Progress bar ──────────────────────────────────────── */
function ProgressBar({ value, color = C.kimb }) {
  return (
    <div style={{ background: C.borderL, borderRadius: 2, height: 7, overflow:'hidden' }}>
      <div style={{ width:`${value}%`, height:'100%', background: color, borderRadius: 2, transition:'width 0.6s' }} />
    </div>
  );
}

/* ── Divider ───────────────────────────────────────────── */
function Divider({ style = {} }) {
  return <hr style={{ border:'none', borderTop:`1.5px solid ${C.borderL}`, ...style }} />;
}

/* ══════════════════════════════════════════════════════════
   NAV BAR
══════════════════════════════════════════════════════════ */
function NavBar({ page, setPage }) {
  const pages = ['Scenarios','Interview','Feedback','Account','Instructor'];
  return (
    <nav style={{
      position:'sticky', top:0, zIndex:100,
      background: C.kimbD,
      display:'flex', alignItems:'center',
      padding:'0 28px', height: 60,
    }}>
      {/* EchoMind logo */}
      <div style={{ marginRight: 40 }}>
        <EchoMindLogo height={45} />
      </div>

      {/* Nav items */}
      <div style={{ display:'flex', alignItems:'center', gap:2, flex:1 }}>
        {pages.map(p => {
          const active = page === p;
          return (
            <button key={p} onClick={() => setPage(p)} style={{
              background:'none', border:'none', cursor:'pointer',
              fontFamily:'Open Sans', fontWeight: active ? 700 : 400,
              fontSize:'0.82rem', letterSpacing:'0.07em', textTransform:'uppercase',
              color: active ? '#fff' : 'rgba(255,255,255,0.58)',
              padding:'0 16px', height:59, position:'relative',
              transition:'color 0.15s',
            }}>
              {p}
              {active && <div style={{ position:'absolute', bottom:0, left:8, right:8, height:3, background: C.energized, borderRadius:'2px 2px 0 0' }} />}
            </button>
          );
        })}
      </div>

      {/* Right: avatar */}
      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
        <div style={{
          width:34, height:34, borderRadius: 3,
          background:`linear-gradient(135deg, ${C.echoMg}, ${C.echoCy})`,
          display:'flex', alignItems:'center', justifyContent:'center',
          color:'#fff', fontFamily:'Bebas Neue', fontSize:'0.95rem', letterSpacing:'0.08em',
        }}>JM</div>
      </div>
    </nav>
  );
}

/* ══════════════════════════════════════════════════════════
   PAGE: FEEDBACK
══════════════════════════════════════════════════════════ */
function ScoreRing({ score }) {
  const r = 52, circ = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  return (
    <svg width={126} height={126} viewBox="0 0 126 126">
      <circle cx={63} cy={63} r={r} fill="none" stroke={C.borderL} strokeWidth={10} />
      <circle cx={63} cy={63} r={r} fill="none" stroke={C.kimb} strokeWidth={10}
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round" transform="rotate(-90 63 63)" />
      <text x={63} y={57} textAnchor="middle" fontFamily="Bebas Neue" fontSize="32" fill={C.kimbD} letterSpacing="2">{score}</text>
      <text x={63} y={75} textAnchor="middle" fontFamily="Open Sans" fontSize="10" fill={C.inkMute}>out of 100</text>
    </svg>
  );
}
