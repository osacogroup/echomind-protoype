<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EchoMind — AI Interview Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body { font-family: 'Open Sans', sans-serif; background: #f5f5f7; color: #1c1c1c; }

  /* OSACO brand tokens */
  :root {
    /* Primary */
    --kimb:    #686CA4;   /* Kimberlite */
    --kimb-d:  #4a4e7a;   /* darkened */
    --kimb-l:  #8589be;   /* lightened */
    --kimb-p:  #eeeef6;   /* pale tint */
    --kimb-t:  #e4e4f0;   /* soft tint */

    /* Secondary */
    --corfu:   #008CB0;   /* Corfu teal */
    --corfu-l: #e0f4fa;
    --plum:    #956188;   /* Plum */
    --plum-l:  #f3eaf1;
    --energized: #D1CD5B; /* Energized yellow */
    --daring:  #FEC340;   /* Daring amber */
    --felt:    #70C097;   /* Felt Green */

    /* EchoMind accent (from logo) */
    --echo-mg: #d520d5;   /* EchoMind magenta */
    --echo-cy: #30c8e8;   /* EchoMind cyan */

    /* Neutrals */
    --ink:     #1c1c1c;
    --ink-mid: #3a3a4a;
    --ink-mute:#6b6b80;
    --ink-lt:  #9999b0;
    --surface: #f5f5f7;
    --white:   #ffffff;
    --border:  #d8d8e8;
    --border-l:#eaeaf2;

    /* Status */
    --success: #1a9070;
    --warn:    #b07820;
    --danger:  #b83030;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--border-l); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  h1, h2, h3, h4, h5 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── colour constants (mirror CSS vars for JS use) ─────── */
const C = {
  kimb:'#686CA4', kimbD:'#4a4e7a', kimbL:'#8589be', kimbP:'#eeeef6', kimbT:'#e4e4f0',
  corfu:'#008CB0', corfuL:'#e0f4fa',
  plum:'#956188', plumL:'#f3eaf1',
  energized:'#D1CD5B', daring:'#FEC340', felt:'#70C097',
  echoMg:'#d520d5', echoCy:'#30c8e8',
  ink:'#1c1c1c', inkMid:'#3a3a4a', inkMute:'#6b6b80', inkLt:'#9999b0',
  surface:'#f5f5f7', white:'#ffffff', border:'#d8d8e8', borderL:'#eaeaf2',
  success:'#1a9070', warn:'#b07820', danger:'#b83030',
};

/* ── Logo: use actual image asset ──────────────────────── */
function EchoMindLogo({ height = 32 }) {
  return <img src="echomind-logo.png" alt="EchoMind" style={{ height, width:'auto', display:'block' }} />;
}
function OsacoLogo({ height = 28 }) {
  return <img src="osaco-logo.png" alt="OSACO" style={{ height, width:'auto', display:'block', filter:'brightness(0) invert(1)' }} />;
}

/* ── Pill label ────────────────────────────────────────── */
function PillLabel({ children, color = C.kimb }) {
  return (
    <span style={{
      display:'inline-block', padding:'3px 14px',
      background: color + '18', color: color,
      borderRadius: 2, fontSize: '0.68rem', fontWeight: 700,
      letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10,
      border: `1px solid ${color}40`,
    }}>{children}</span>
  );
}

/* ── Section heading ───────────────────────────────────── */
function SectionHeading({ label, title, subtitle }) {
  return (
    <div style={{ marginBottom: 28 }}>
      <PillLabel>{label}</PillLabel>
      <h1 style={{ fontFamily:'Bebas Neue', fontSize:'2.6rem', color: C.kimbD, lineHeight:1.1, letterSpacing:'0.05em' }}>{title}</h1>
      {subtitle && <p style={{ color: C.inkMute, marginTop: 7, fontSize:'0.88rem', lineHeight: 1.6 }}>{subtitle}</p>}
    </div>
  );
}

/* ── Card ──────────────────────────────────────────────── */
function Card({ children, style = {}, topBorderColor, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: C.white, border:`1.5px solid ${C.border}`, borderRadius: 4,
      overflow:'hidden', cursor: onClick ? 'pointer' : 'default',
      ...(topBorderColor ? { borderTop:`3px solid ${topBorderColor}` } : {}),
      ...style,
    }}>{children}</div>
  );
}

/* ── Primary button ────────────────────────────────────── */
function PrimaryBtn({ children, onClick, disabled, color = C.kimb, style = {} }) {
  const [hov, setHov] = useState(false);
  const bg = disabled ? '#bbb' : hov ? C.kimbD : color;
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        background: bg, color:'#fff', border:'none', borderRadius: 3,
        padding:'10px 24px', fontFamily:'Open Sans', fontWeight:700,
        fontSize:'0.83rem', cursor: disabled ? 'not-allowed' : 'pointer',
        letterSpacing:'0.06em', textTransform:'uppercase',
        transition:'background 0.18s', ...style,
      }}>{children}</button>
  );
}

/* ── Ghost button ──────────────────────────────────────── */
function GhostBtn({ children, onClick, color = C.kimb, style = {} }) {
  const [hov, setHov] = useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        background: hov ? color + '10' : 'transparent',
        color: hov ? color : C.inkMid,
        border:`1.5px solid ${hov ? color : C.border}`,
        borderRadius: 3, padding:'9px 20px',
        fontFamily:'Open Sans', fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase',
        fontSize:'0.78rem', cursor:'pointer', transition:'all 0.18s', ...style,
      }}>{children}</button>
  );
}

/* ── Progress bar ──────────────────────────────────────── */
function ProgressBar({ value, color = C.kimb }) {
  return (
    <div style={{ background: C.borderL, borderRadius: 2, height: 7, overflow:'hidden' }}>
      <div style={{ width:`${value}%`, height:'100%', background: color, borderRadius: 2, transition:'width 0.6s' }} />
    </div>
  );
}

/* ── Divider ───────────────────────────────────────────── */
function Divider({ style = {} }) {
  return <hr style={{ border:'none', borderTop:`1.5px solid ${C.borderL}`, ...style }} />;
}

/* ══════════════════════════════════════════════════════════
   NAV BAR
══════════════════════════════════════════════════════════ */
function NavBar({ page, setPage }) {
  const pages = ['Scenarios','Interview','Feedback','Account','Instructor','Contact'];
  return (
    <nav style={{
      position:'sticky', top:0, zIndex:100,
      background: C.kimbD,
      display:'flex', alignItems:'center',
      padding:'0 28px', height: 60,
    }}>
      {/* EchoMind logo */}
      <div style={{ marginRight: 40 }}>
        <EchoMindLogo height={45} />
      </div>

      {/* Nav items */}
      <div style={{ display:'flex', alignItems:'center', gap:2, flex:1 }}>
        {pages.map(p => {
          const active = page === p;
          return (
            <button key={p} onClick={() => setPage(p)} style={{
              background:'none', border:'none', cursor:'pointer',
              fontFamily:'Open Sans', fontWeight: active ? 700 : 400,
              fontSize:'0.82rem', letterSpacing:'0.07em', textTransform:'uppercase',
              color: active ? '#fff' : 'rgba(255,255,255,0.58)',
              padding:'0 16px', height:59, position:'relative',
              transition:'color 0.15s',
            }}>
              {p}
              {active && <div style={{ position:'absolute', bottom:0, left:8, right:8, height:3, background: C.energized, borderRadius:'2px 2px 0 0' }} />}
            </button>
          );
        })}
      </div>

      {/* Right: avatar */}
      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
        <div style={{
          width:34, height:34, borderRadius: 3,
          background:`linear-gradient(135deg, ${C.echoMg}, ${C.echoCy})`,
          display:'flex', alignItems:'center', justifyContent:'center',
          color:'#fff', fontFamily:'Bebas Neue', fontSize:'0.95rem', letterSpacing:'0.08em',
        }}>JM</div>
      </div>
    </nav>
  );
}

/* ══════════════════════════════════════════════════════════
   PAGE: SCENARIOS
══════════════════════════════════════════════════════════ */
function ScenariosPage({ setPage }) {
  const [selected, setSelected] = useState(null);

  const scenarios = [
    {
      id:'law', accentColor: C.kimbD, domain:'Law Enforcement', title:'Investigative Interview',
      desc:'Practice structured questioning techniques in high-stakes criminal investigation settings with resistant subjects.',
      count:12, tag:'PEACE Model',
    },
    {
      id:'mil', accentColor: C.corfu, domain:'Military', title:'Intelligence Debrief',
      desc:'Conduct HUMINT debriefs and source assessment interviews aligned with military operational protocols.',
      count:8, tag:'HUMINT',
    },
    {
      id:'sales', accentColor: C.plum, domain:'Sales', title:'Discovery & Closing',
      desc:'Master consultative discovery conversations and objection handling to move prospects through the pipeline.',
      count:15, tag:'Consultative',
    },
  ];

  return (
    <div>
      {/* Hero banner */}
      <div style={{
        background: `linear-gradient(105deg, ${C.kimbD} 0%, ${C.kimb} 60%, ${C.corfu} 100%)`,
        padding:'52px 40px 44px',
      }}>
        <PillLabel color={C.energized}>EchoMind Preview</PillLabel>
        <h1 style={{ fontFamily:'Bebas Neue', fontSize:'3.2rem', color:'#fff', lineHeight:1.1, maxWidth:560, letterSpacing:'0.05em', marginBottom:12 }}>
          The Future of Interview<br />Training is Here
        </h1>
        <p style={{ color:'rgba(255,255,255,0.68)', fontSize:'0.9rem', maxWidth:500, lineHeight:1.7 }}>
          EchoMind uses AI-powered avatars to simulate real interview scenarios across Law Enforcement, Military and Sales domains. The videos below are early previews of how each session will work — giving you a glimpse of the immersive, evidence-based training experience we are building.
        </p>
        <div style={{ display:'flex', gap:40, marginTop:32 }}>
          {[['10', 'Scenarios available'], ['8', 'Sessions completed'], ['92%', 'Trainee satisfaction']].map(([n, l]) => (
            <div key={l}>
              <div style={{ fontFamily:'Bebas Neue', fontSize:'2.4rem', color: C.energized, letterSpacing:'0.04em', lineHeight:1 }}>{n}</div>
              <div style={{ fontSize:'0.7rem', color:'rgba(255,255,255,0.5)', letterSpacing:'0.1em', textTransform:'uppercase', marginTop:4 }}>{l}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding:'36px 40px' }}>

        {/* Scenario cards */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20, marginBottom:36 }}>
          {scenarios.map(s => {
            const isSelected = selected === s.id;
            return (
              <Card key={s.id} topBorderColor={s.accentColor}
                onClick={() => setSelected(s.id)}
                style={{
                  transition:'all 0.18s',
                  boxShadow: isSelected
                    ? `0 0 0 2.5px ${s.accentColor}, 0 6px 24px ${s.accentColor}22`
                    : '0 2px 8px rgba(0,0,0,0.05)',
                }}>
                <div style={{ padding:'22px 20px' }}>
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:14 }}>
                    <span style={{ fontSize:'0.65rem', fontWeight:700, letterSpacing:'0.1em', color: s.accentColor, textTransform:'uppercase' }}>{s.domain}</span>
                    <span style={{ background: C.surface, color: C.inkMute, fontSize:'0.65rem', fontWeight:700, padding:'3px 8px', borderRadius:2, letterSpacing:'0.06em' }}>
                      {s.tag}
                    </span>
                  </div>
                  <h3 style={{ fontFamily:'Bebas Neue', fontSize:'1.55rem', color: C.kimbD, marginBottom:10, letterSpacing:'0.04em' }}>{s.title}</h3>
                  <p style={{ fontSize:'0.82rem', color: C.inkMute, lineHeight:1.6 }}>{s.desc}</p>
                  <div style={{ marginTop:16, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                    <span style={{ fontSize:'0.72rem', color: C.inkLt }}>{s.count} scenarios</span>
                    {isSelected && (
                      <span style={{ display:'flex', alignItems:'center', gap:5, color: s.accentColor, fontSize:'0.72rem', fontWeight:700, letterSpacing:'0.06em' }}>
                        <span style={{ width:7, height:7, borderRadius:'50%', background: s.accentColor, display:'inline-block' }} />
                        SELECTED
                      </span>
                    )}
                  </div>
                </div>
              </Card>
            );
          })}
        </div>

        <Divider style={{ marginBottom:36 }} />

  {/* Video preview section */}
        <div style={{ background: C.inkMid, borderRadius:6, overflow:'hidden', marginBottom:32 }}>
          <div style={{ padding:'18px 24px 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div>
              <div style={{ color:'rgba(255,255,255,0.45)', fontSize:'0.65rem', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:4 }}>Preview</div>
              <div style={{ color:'#fff', fontFamily:'Bebas Neue', fontSize:'1.35rem', letterSpacing:'0.05em' }}>
                {selected === 'sales' ? 'Sales: Discovery & Closing Demo' : 'Sample Interview Session'}
              </div>
            </div>
          </div>

          {/* Video area */}
          <div style={{ margin:'16px 24px 24px', borderRadius:4, overflow:'hidden', position:'relative' }}>

           {/* Sales video - YouTube */}
            {selected === 'sales' && (
              <iframe
                width="100%"
                height="450"
                src="https://www.youtube.com/embed/N4CW4Y9IPQ4?si=5KGyxbEv5FULWvB3&rel=0&modestbranding=1"
                title="Sales Demo"
                frameBorder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerPolicy="strict-origin-when-cross-origin"
                allowFullScreen
                style={{ display:'block' }}
              />
            )}

            {/* Military video - YouTube */}
            {selected === 'mil' && (
              <iframe
                width="100%"
                height="450"
                src="https://www.youtube.com/embed/1NSwi4j45gI?si=uYb5Y8TX6EMqjlO4&rel=0&modestbranding=1"
                title="Military Intelligence Debrief Demo"
                frameBorder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerPolicy="strict-origin-when-cross-origin"
                allowFullScreen
                style={{ display:'block' }}
              />
            )}

            {/* Law Enforcement - Coming Soon placeholder */}
            {selected === 'law' && (
              <div style={{
                height: 450, background:'#111827',
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:16,
              }}>
                <div style={{ fontSize:'2.5rem' }}>🎬</div>
                <div style={{ fontFamily:'Bebas Neue', fontSize:'1.8rem', color:'#fff', letterSpacing:'0.08em' }}>Coming Soon</div>
                <div style={{ fontSize:'0.82rem', color:'rgba(255,255,255,0.45)' }}>Demo video for this scenario is in production</div>
              </div>
            )}

  {/* No selection - default placeholder */}
            {!selected && (
              <div style={{
                height: 450, background:'#111827',
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12,
              }}>
                <div style={{ display:'flex', alignItems:'center', gap:3, opacity:0.25 }}>
                  {Array.from({length:70}, (_,i) => (
                    <div key={i} style={{ width:3, borderRadius:2,
                      height: Math.abs(Math.sin(i*0.38)*28 + Math.cos(i*0.71)*14) + 4,
                      background:`linear-gradient(to top, ${C.corfu}, ${C.kimb})` }} />
                  ))}
                </div>
                <div style={{ fontSize:'0.82rem', color:'rgba(255,255,255,0.35)', marginTop:8 }}>Select a scenario above to preview</div>
              </div>
            )}

          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PAGE: INTERVIEW
══════════════════════════════════════════════════════════ */
function InterviewPage() {
 
  return (
    <div style={{ padding:'28px 32px' }}>
      <div>
        {/* Avatar viewport with YouTube video */}
        <div style={{ background: C.inkMid, borderRadius:6, overflow:'hidden', position:'relative', marginBottom:16 }}>
          
          {/* YouTube iframe */}
          <iframe
            width="100%"
            height="500"
            src="https://www.youtube.com/embed/ohDRIxZqLs8?si=Ct2rXCZ1tdaoH5Cz"
            title="YouTube video player"
            frameBorder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerPolicy="strict-origin-when-cross-origin"

            style={{ display:'block' }}
          />

          {/* Name tag */}
          <div style={{ position:'absolute', bottom:16, left:16,

            letterSpacing:'0.08em', textTransform:'uppercase' }}>

          </div>

          {/* LIVE badge */}
          <div style={{ position:'absolute', top:14, right:14, display:'flex', alignItems:'center', gap:6,

            <div style={{ width:7, height:7, borderRadius:'50%', background:'#ff6666', animation:'blink 1.2s infinite' }} />

      <style>{`@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }`}</style>

/* ══════════════════════════════════════════════════════════
   PAGE: FEEDBACK
══════════════════════════════════════════════════════════ */

  const [view, setView] = useState('overall');
  const [selected, setSelected] = useState(null);

  const SESSIONS = {
    s1: {
      id: 's1', scenario: 'Investigative Interview', domain: 'Law Enforcement',
      date: '3 May 2026', duration: '14:07', score: 78,
      accentColor: C.kimb, accentLight: C.kimb + '18', accentDark: C.kimbD,
      metrics: [
        { label: 'Rapport Building', value: 84, color: C.success },
        { label: 'Open-Ended Questions', value: 72, color: C.kimb },

        { label: 'Non-Leading Language', value: 68, color: C.warn },

══════════════════════════════════════════════════════════ */
function InstructorPage() {
  const metrics = [
    { label:'Active Trainees', value:24, color: C.corfu },
    { label:'Average Score', value:'76.4', color: C.success },
    { label:'Sessions This Week', value:38, color: C.kimb },
    { label:'Need Attention', value:4, color: C.danger },
  ];

  const trainees = [
    { name:'Jordan Mills', rank:'Det. Constable', last:'3 May 2026', score:78, sessions:8, progress:80, flag:'green' },
    { name:'Marcus Chen', rank:'Constable', last:'2 May 2026', score:65, sessions:6, progress:60, flag:'amber' },
    { name:'Priya Nair', rank:'Sergeant', last:'1 May 2026', score:91, sessions:10, progress:100, flag:'green' },
    { name:'Tom Bradley', rank:'Constable', last:'28 Apr 2026', score:42, sessions:3, progress:30, flag:'red' },
    { name:'Sarah Okafor', rank:'Det. Constable', last:'30 Apr 2026', score:83, sessions:9, progress:90, flag:'green' },
    { name:'Lee Park', rank:'Constable', last:'26 Apr 2026', score:55, sessions:5, progress:50, flag:'amber' },
    { name:'Diana Reyes', rank:'Inspector', last:'3 May 2026', score:88, sessions:10, progress:100, flag:'green' },
    { name:'James Whitfield', rank:'Constable', last:'22 Apr 2026', score:38, sessions:2, progress:20, flag:'red' },
  ];

  const flagColors = { green: C.success, amber: C.warn, red: C.danger };
  const flagBg = { green: C.felt + '20', amber: C.daring + '20', red: '#b83030' + '15' };
  const [hov, setHov] = useState(null);

  return (
    <div style={{ padding:'28px 32px' }}>
      <SectionHeading label="Instructor Dashboard" title="Trainee Overview" subtitle="Metropolitan Police Service — EchoMind Training Programme" />

      {/* Metric tiles */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16, marginBottom:28 }}>
        {metrics.map(m => (
          <Card key={m.label} topBorderColor={m.color} style={{ padding:'20px 18px' }}>
            <div style={{ fontSize:'0.65rem', color: C.inkMute, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8 }}>{m.label}</div>
            <div style={{ fontFamily:'Bebas Neue', fontSize:'2.6rem', color: m.color, lineHeight:1 }}>{m.value}</div>
          </Card>
        ))}
      </div>

      {/* Trainee table */}
      <Card>
        <div style={{ padding:'16px 20px', borderBottom:`1.5px solid ${C.borderL}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontFamily:'Bebas Neue', fontSize:'1.25rem', color: C.kimbD, letterSpacing:'0.05em' }}>Trainee Progress</span>
          <GhostBtn style={{ padding:'6px 14px', fontSize:'0.72rem' }}>Export CSV</GhostBtn>
        </div>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr style={{ background: C.surface }}>
                {['Name','Rank','Last Session','Score','Sessions (max 10)','Progress','Actions'].map(h => (
                  <th key={h} style={{ padding:'10px 16px', textAlign:'left', fontSize:'0.62rem', fontWeight:700, color: C.inkLt, letterSpacing:'0.1em', textTransform:'uppercase', whiteSpace:'nowrap' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {trainees.map((t, i) => (
                <tr key={t.name}
                  onMouseEnter={() => setHov(i)} onMouseLeave={() => setHov(null)}
                  style={{ background: hov===i ? C.kimbP : C.white, transition:'background 0.15s', borderTop:`1px solid ${C.borderL}` }}>
                  <td style={{ padding:'13px 16px' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:32, height:32, borderRadius:3,
                        background:`linear-gradient(135deg, ${C.kimb}50, ${C.corfu}40)`,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:'0.68rem', fontWeight:700, color: C.kimbD }}>
                        {t.name.split(' ').map(n=>n[0]).join('')}
                      </div>
                      <span style={{ fontWeight:600, color: C.ink, fontSize:'0.85rem' }}>{t.name}</span>
                    </div>
                  </td>
                  <td style={{ padding:'13px 16px', fontSize:'0.82rem', color: C.inkMute }}>{t.rank}</td>
                  <td style={{ padding:'13px 16px', fontSize:'0.82rem', color: C.inkMute, whiteSpace:'nowrap' }}>{t.last}</td>
                  <td style={{ padding:'13px 16px' }}>
                    <span style={{ background: flagBg[t.flag], color: flagColors[t.flag],
                      borderRadius:2, padding:'3px 10px', fontSize:'0.78rem', fontWeight:700,
                      letterSpacing:'0.04em' }}>
                      {t.score}
                    </span>
                  </td>
                  <td style={{ padding:'13px 16px', fontSize:'0.82rem', color: C.inkMute, textAlign:'center' }}>{t.sessions} / 10</td>
                  <td style={{ padding:'13px 16px', minWidth:110 }}>
                    <ProgressBar value={t.progress} color={flagColors[t.flag]} />
                  </td>
                  <td style={{ padding:'13px 16px' }}>
                    <div style={{ display:'flex', gap:10 }}>
                      <button style={{ background:'none', border:'none', cursor:'pointer', color: C.kimb, fontWeight:700, fontSize:'0.78rem', padding:0, textTransform:'uppercase', letterSpacing:'0.06em' }}>Report</button>
                      <span style={{ color: C.borderL }}>|</span>
                      <button style={{ background:'none', border:'none', cursor:'pointer', color: C.inkMute, fontWeight:700, fontSize:'0.78rem', padding:0, textTransform:'uppercase', letterSpacing:'0.06em' }}>Recording</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   FOOTER
══════════════════════════════════════════════════════════ */
function Footer() {
  return (
    <footer style={{ background: C.kimbD, padding:'22px 40px', display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:'auto' }}>
      <span style={{ color:'rgba(255,255,255,0.35)', fontSize:'0.75rem' }}>© 2026 EchoMind. All rights reserved.</span>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        <span style={{ color:'rgba(255,255,255,0.35)', fontSize:'0.72rem', textTransform:'uppercase', letterSpacing:'0.08em' }}>Powered by</span>
        <OsacoLogo height={22} />
      </div>
    </footer>
  );
}
/* ══════════════════════════════════════════════════════════
   PAGE: CONTACT
══════════════════════════════════════════════════════════ */
function ContactPage() {
  const [form, setForm] = useState({
    firstName:'', lastName:'', organisation:'', position:'',
    email:'', phone:'', country:'', interest:'',
  });
  const [submitted, setSubmitted] = useState(false);

  function handleSubmit() {
    if (!form.firstName || !form.email || !form.interest) return;
    setSubmitted(true);
  }

  const interests = [
    'Signing up for the EchoMind Pilot Programme',
    'Investing in EchoMind',
    'Other / General Enquiry',
  ];

  return (
    <div style={{ padding:'40px 40px', maxWidth:1100, margin:'0 auto' }}>

      {/* Page heading */}
      <div style={{ marginBottom:36 }}>
        <PillLabel color={C.kimb}>Get In Touch</PillLabel>
        <h1 style={{ fontFamily:'Bebas Neue', fontSize:'2.8rem', color: C.kimbD, lineHeight:1.1, letterSpacing:'0.05em', marginBottom:12 }}>
          Connect With the EchoMind Team
        </h1>
        <p style={{ color: C.inkMute, fontSize:'0.92rem', maxWidth:600, lineHeight:1.7 }}>
          We place a great emphasis on personal relationships and trust. All conversations with us are handled with discretion and without any obligation. Fill in the form below and we will be in touch.
        </p>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 380px', gap:32 }}>

        {/* ── Contact form ── */}
        <Card style={{ padding:'32px 28px' }}>
          {submitted ? (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', gap:16 }}>
              <div style={{ fontSize:'3rem' }}>✅</div>
              <h3 style={{ fontFamily:'Bebas Neue', fontSize:'2rem', color: C.kimbD, letterSpacing:'0.05em' }}>Thank You!</h3>
              <p style={{ color: C.inkMute, textAlign:'center', fontSize:'0.9rem', lineHeight:1.7, maxWidth:400 }}>
                Your enquiry has been received. A member of the OSACO EchoMind team will be in touch with you shortly.
              </p>
              <button onClick={() => { setSubmitted(false); setForm({ firstName:'', lastName:'', organisation:'', position:'', email:'', phone:'', country:'', interest:'' }); }}
                style={{ marginTop:12, background:'none', border:`1.5px solid ${C.kimb}`, borderRadius:3, padding:'8px 20px', color: C.kimb, fontFamily:'Open Sans', fontWeight:700, fontSize:'0.78rem', letterSpacing:'0.06em', textTransform:'uppercase', cursor:'pointer' }}>
                Submit Another Enquiry
              </button>
            </div>
          ) : (
            <>
              <h4 style={{ fontFamily:'Bebas Neue', fontSize:'1.3rem', color: C.kimbD, letterSpacing:'0.05em', marginBottom:22 }}>Your Details</h4>

              {/* Name row */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16 }}>
                {[['firstName','First Name'],['lastName','Last Name']].map(([key, label]) => (
                  <div key={key}>
                    <label style={{ display:'block', fontSize:'0.72rem', fontWeight:700, color: C.inkMute, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.07em' }}>{label} <span style={{ color: C.danger }}>*</span></label>
                    <input type="text" value={form[key]}
                      onChange={e => setForm(f => ({...f,[key]:e.target.value}))}
                      style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${C.border}`, borderRadius:3, fontFamily:'Open Sans', fontSize:'0.88rem', color: C.ink, outline:'none', background:'#fff' }}
                      onFocus={e => e.target.style.borderColor = C.kimb}
                      onBlur={e => e.target.style.borderColor = C.border}
                    />
                  </div>
                ))}
              </div>

              {/* Organisation + Position */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16 }}>
                {[['organisation','Organisation'],['position','Position / Role']].map(([key, label]) => (
                  <div key={key}>
                    <label style={{ display:'block', fontSize:'0.72rem', fontWeight:700, color: C.inkMute, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.07em' }}>{label}</label>
                    <input type="text" value={form[key]}
                      onChange={e => setForm(f => ({...f,[key]:e.target.value}))}
                      style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${C.border}`, borderRadius:3, fontFamily:'Open Sans', fontSize:'0.88rem', color: C.ink, outline:'none', background:'#fff' }}
                      onFocus={e => e.target.style.borderColor = C.kimb}
                      onBlur={e => e.target.style.borderColor = C.border}
                    />
                  </div>
                ))}
              </div>

              {/* Email + Phone */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16 }}>
                {[['email','Email Address','email'],['phone','Contact Phone','tel']].map(([key, label, type]) => (
                  <div key={key}>
                    <label style={{ display:'block', fontSize:'0.72rem', fontWeight:700, color: C.inkMute, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.07em' }}>{label} {key==='email' && <span style={{ color: C.danger }}>*</span>}</label>
                    <input type={type} value={form[key]}
                      onChange={e => setForm(f => ({...f,[key]:e.target.value}))}
                      style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${C.border}`, borderRadius:3, fontFamily:'Open Sans', fontSize:'0.88rem', color: C.ink, outline:'none', background:'#fff' }}
                      onFocus={e => e.target.style.borderColor = C.kimb}
                      onBlur={e => e.target.style.borderColor = C.border}
                    />
                  </div>
                ))}
              </div>

              {/* Country */}
              <div style={{ marginBottom:16 }}>
                <label style={{ display:'block', fontSize:'0.72rem', fontWeight:700, color: C.inkMute, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.07em' }}>Country</label>
                <input type="text" value={form.country}
                  onChange={e => setForm(f => ({...f, country:e.target.value}))}
                  style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${C.border}`, borderRadius:3, fontFamily:'Open Sans', fontSize:'0.88rem', color: C.ink, outline:'none', background:'#fff' }}
                  onFocus={e => e.target.style.borderColor = C.kimb}
                  onBlur={e => e.target.style.borderColor = C.border}
                />
              </div>

              {/* Interest */}
              <div style={{ marginBottom:24 }}>
                <label style={{ display:'block', fontSize:'0.72rem', fontWeight:700, color: C.inkMute, marginBottom:10, textTransform:'uppercase', letterSpacing:'0.07em' }}>I am interested in <span style={{ color: C.danger }}>*</span></label>
                <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                  {interests.map(opt => (
                    <label key={opt} style={{ display:'flex', alignItems:'center', gap:10, cursor:'pointer' }}>
                      <div onClick={() => setForm(f => ({...f, interest: opt}))}
                        style={{ width:18, height:18, borderRadius:'50%', border:`2px solid ${form.interest === opt ? C.kimb : C.border}`, background: form.interest === opt ? C.kimb : '#fff', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer', transition:'all 0.15s' }}>
                        {form.interest === opt && <div style={{ width:7, height:7, borderRadius:'50%', background:'#fff' }} />}
                      </div>
                      <span style={{ fontSize:'0.88rem', color: form.interest === opt ? C.kimbD : C.inkMid, fontWeight: form.interest === opt ? 600 : 400 }}>{opt}</span>
                    </label>
                  ))}
                </div>
              </div>

              {/* Submit */}
              <PrimaryBtn onClick={handleSubmit}
                disabled={!form.firstName || !form.email || !form.interest}
                style={{ padding:'13px 36px', fontSize:'0.85rem' }}>
                Submit Enquiry →
              </PrimaryBtn>
              <p style={{ marginTop:10, fontSize:'0.72rem', color: C.inkLt }}>* Required fields. All enquiries are handled in confidence.</p>
            </>
          )}
        </Card>

        {/* ── Right sidebar: About OSACO ── */}
        <div style={{ display:'flex', flexDirection:'column', gap:20 }}>

          {/* About OSACO */}
          <Card style={{ padding:'24px 20px' }}>
            <h4 style={{ fontFamily:'Bebas Neue', fontSize:'1.1rem', color: C.kimbD, letterSpacing:'0.05em', marginBottom:12 }}>About OSACO</h4>
            <p style={{ fontSize:'0.82rem', color: C.inkMid, lineHeight:1.7, marginBottom:12 }}>
              OSACO Group provides expert investigators and specialists to help organisations predict, prevent and respond to human risk factors. We are agile, responsive and highly capable.
            </p>
            <p style={{ fontSize:'0.82rem', color: C.inkMid, lineHeight:1.7, marginBottom:16 }}>
              We believe global systems work better when they display higher levels of ethics and transparency — and EchoMind is our commitment to building the training tools that make that possible.
            </p>
            <a href="https://www.osacogroup.com" target="_blank" rel="noreferrer"
              style={{ display:'inline-flex', alignItems:'center', gap:8, color: C.kimb, fontWeight:700, fontSize:'0.78rem', textDecoration:'none', letterSpacing:'0.04em',
                padding:'8px 14px', border:`1.5px solid ${C.kimb}`, borderRadius:3 }}>
              <span style={{ fontSize:'0.9rem' }}>🌐</span> Visit osacogroup.com
            </a>
          </Card>

          {/* What we do */}
          <Card style={{ padding:'24px 20px' }}>
            <h4 style={{ fontFamily:'Bebas Neue', fontSize:'1.1rem', color: C.kimbD, letterSpacing:'0.05em', marginBottom:14 }}>What OSACO Does</h4>
           {[
              ['I', 'Investigations', 'Workplace misconduct, fraud and corruption investigations across all sectors.'],
              ['T', 'Training', 'Interview, intelligence analysis and investigations training for professionals.'],
              ['S', 'Safeguarding', 'Audit and review services to protect organisations and their people.'],
              ['E', 'EchoMind', 'AI-powered avatar training for law enforcement, military and sales professionals.'],
            ].map(([letter, title, desc]) => (
              <div key={title} style={{ display:'flex', gap:12, marginBottom:14 }}>
                <div style={{
                  width:28, height:28, borderRadius:4, background: C.kimbP,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  flexShrink:0, color: C.kimbD, fontFamily:'Bebas Neue',
                  fontSize:'0.95rem', letterSpacing:'0.05em',
                }}>{letter}</div>
                <div>
                  <div style={{ fontWeight:700, color: C.kimbD, fontSize:'0.82rem', marginBottom:2 }}>{title}</div>
                  <div style={{ fontSize:'0.78rem', color: C.inkMute, lineHeight:1.5 }}>{desc}</div>
                </div>
              </div>
            ))}
          </Card>

 {/* Global presence */}
          <Card style={{ padding:'20px' }}>
            <h4 style={{ fontFamily:'Bebas Neue', fontSize:'1.1rem', color: C.kimbD, letterSpacing:'0.05em', marginBottom:12 }}>Global Presence</h4>
            {[
              ['🇳🇿', 'New Zealand', 'osacogroup.com/new-zealand-workplace-investigations'],
              ['🇺🇸', 'North America', 'osacogroup.com/usa'],
              ['🌍', 'Africa', 'osacogroup.com/africa'],
            ].map(([flag, region, url]) => (
              <div key={region} style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
                <span style={{ fontSize:'1.6rem', lineHeight:1 }}>{flag}</span>
                <div>
                  <div style={{ fontWeight:700, color: C.kimbD, fontSize:'0.8rem' }}>{region}</div>
                  <a href={`https://www.${url}`} target="_blank" rel="noreferrer"
                    style={{ fontSize:'0.72rem', color: C.kimb, textDecoration:'none' }}>
                    {url}
                  </a>
                </div>
              </div>
            ))}
          </Card>

        </div>
      </div>
    </div>
  );
}
 
/* ══════════════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════════════ */
function App() {
  const [page, setPage] = useState('Scenarios');
  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <NavBar page={page} setPage={setPage} />
      <div style={{ flex:1 }}>
        {page==='Scenarios' && <ScenariosPage setPage={setPage} />}
        {page==='Interview' && <InterviewPage />}
        {page==='Feedback' && <FeedbackPage />}
        {page==='Account' && <AccountPage />}
        {page==='Instructor' && <InstructorPage />}
        {page==='Contact' && <ContactPage />}
      </div>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
